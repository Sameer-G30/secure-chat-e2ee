# Name the required verification workflow shown in GitHub checks.
name: Continuous integration

# Run verification for proposed and accepted changes.
on:
  # Verify every pull request targeting any branch.
  pull_request:
  # Verify direct pushes while the repository is still being established.
  push:

# Restrict the default token to repository read access.
permissions:
  # Permit actions to check out source without write capability.
  contents: read

# Define independent checks that can execute concurrently.
jobs:
  # Verify the FastAPI foundation and its quality gates.
  backend:
    # Ubuntu 24.04 still has the Python 3.11.9 build. ubuntu-latest is 26.04 and does not.
    runs-on: ubuntu-24.04
    # Set backend commands relative to the Python project.
    defaults:
      # Configure every shell step in this job.
      run:
        # Enter the backend directory before each command.
        working-directory: backend
    # Execute setup and verification in dependency order.
    steps:
      # Download the exact proposed repository revision.
      - name: Check out source
        # Use GitHub's maintained checkout action.
        uses: actions/checkout@v4
      # Install the Python version fixed by the project.
      - name: Set up Python
        # Use GitHub's maintained Python setup action.
        uses: actions/setup-python@v5
        # Configure the selected patch version.
        with:
          # Match local pyenv and Docker exactly.
          python-version: 3.11.9
      # Install uv with its built-in dependency cache.
      - name: Set up uv
        # Use Astral's maintained setup action.
        uses: astral-sh/setup-uv@v7
        # Configure reproducible installation behavior.
        with:
          # Enable uv's GitHub Actions dependency cache.
          enable-cache: true
      # Recreate the locked backend environment.
      - name: Install backend dependencies
        # Refuse to rewrite the reviewed lock file in CI.
        run: uv sync --frozen
      # Exercise the public API contract.
      - name: Run backend tests
        # Run the complete first-slice pytest suite.
        run: uv run pytest
      # Reject Python correctness and style regressions.
      - name: Lint backend
        # Run Ruff across application, tests, and migration configuration.
        run: uv run ruff check .
      # Reject weakening of the backend type contract.
      - name: Type-check backend
        # Analyze the application and its tests in strict mode.
        run: uv run mypy app tests

  # Verify React, TypeScript, UI behavior, and the crypto proof.
  frontend:
    # Ubuntu 24.04 still has the Python 3.11.9 build. ubuntu-latest is 26.04 and does not.
    runs-on: ubuntu-24.04
    # Set frontend commands relative to the Vite project.
    defaults:
      # Configure every shell step in this job.
      run:
        # Enter the frontend directory before each command.
        working-directory: frontend
    # Execute setup and verification in dependency order.
    steps:
      # Download the exact proposed repository revision.
      - name: Check out source
        # Use GitHub's maintained checkout action.
        uses: actions/checkout@v4
      # Install the required Node 22 runtime and npm cache.
      - name: Set up Node
        # Use GitHub's maintained Node setup action.
        uses: actions/setup-node@v4
        # Configure the project runtime and dependency cache.
        with:
          # Match the WSL nvm major version.
          node-version: 22
          # Cache npm's package archive between CI runs.
          cache: npm
          # Locate the lock file below the repository root.
          cache-dependency-path: frontend/package-lock.json
      # Recreate exactly the reviewed JavaScript dependency graph.
      - name: Install frontend dependencies
        # Use the lock-file-only clean installation command.
        run: npm ci
      # Prove the accessible UI and complete crypto round trip.
      - name: Run frontend and crypto tests
        # Execute Vitest once with a non-watch exit code.
        run: npm run test
      # Reject TypeScript and production-bundling failures.
      - name: Build frontend
        # Compile TypeScript and create optimized static assets.
        run: npm run build
      # Reject JavaScript and JSX correctness regressions.
      - name: Lint frontend
        # Run the scaffold's fast Oxlint configuration.
        run: npm run lint

  # Verify offline data-preparation source without downloading corpora.
  ml:
    # Ubuntu 24.04 still has the Python 3.11.9 build. ubuntu-latest is 26.04 and does not.
    runs-on: ubuntu-24.04
    # Set commands relative to the independent ML project.
    defaults:
      # Configure every shell step in this job.
      run:
        # Enter the ML directory before each command.
        working-directory: ml
    # Execute setup and static verification in dependency order.
    steps:
      # Download the exact proposed repository revision.
      - name: Check out source
        # Use GitHub's maintained checkout action.
        uses: actions/checkout@v4
      # Install the project-wide Python patch version.
      - name: Set up Python
        # Use GitHub's maintained Python setup action.
        uses: actions/setup-python@v5
        # Configure the selected interpreter.
        with:
          # Match local model-research environments exactly.
          python-version: 3.11.9
      # Install uv with dependency caching.
      - name: Set up uv
        # Use Astral's maintained setup action.
        uses: astral-sh/setup-uv@v7
        # Configure uv's cache.
        with:
          # Reuse downloaded scientific packages across runs.
          enable-cache: true
      # Recreate the reviewed ML dependency graph.
      - name: Install ML dependencies
        # Refuse to mutate the lock file in CI.
        run: uv sync --frozen
      # Check deterministic data-preparation source quality.
      - name: Lint ML scripts
        # Run Ruff without requiring network dataset access.
        run: uv run ruff check scripts src tests
      # Exercise the baseline pipeline against tiny synthetic data, not downloaded corpora.
      - name: Run ML unit tests
        # These tests never touch ml/data/raw, so no dataset download is needed in CI.
        run: uv run pytest

  # Run the backend suite against a real PostgreSQL, since SQLite hides dialect differences.
  backend-postgres:
    runs-on: ubuntu-24.04
    # Provide a throwaway Postgres reachable on localhost.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: secure_chat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11.9
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      # Point the suite at Postgres; conftest drops and recreates the schema per test.
      - name: Run backend tests on Postgres
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://ci:ci-only-password@localhost:5432/secure_chat_test
        run: uv run pytest

  # Build the API image so Dockerfile regressions fail before deployment.
  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t secure-chat-api:ci backend

  # Scan dependencies and history for known vulnerabilities and leaked secrets.
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs full history to scan past commits.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Audit Python dependencies
        working-directory: backend
        # The export is already fully resolved and has no hashes, so pip-audit must not try to install deps.
        run: uv export --frozen --no-dev --no-hashes -o /tmp/req.txt && uvx pip-audit -r /tmp/req.txt --disable-pip --no-deps
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
