# Assign a version so later dataset changes remain auditable.
schema_version: 1

# Define the canonical columns expected from every normalized source.
columns:
  # Preserve a stable source-specific identifier for deduplication.
  - message_id
  # Store the original message text used for training and evaluation.
  - text
  # Store the unified binary target consumed by classifiers.
  - label
  # Preserve the human-readable source label for auditability.
  - original_label
  # Record which public or curated corpus supplied the sample.
  - source
  # Record the intended split without silently mixing evaluation data.
  - split

# Map all corpora onto one binary decision boundary.
labels:
  # Treat ordinary legitimate messages as the negative class.
  legitimate: 0
  # Treat spam, phishing, and scam messages as the warning class.
  scam: 1

# Document source-specific mappings before any data is combined.
source_mappings:
  # Normalize UCI SMS Spam Collection labels.
  uci_sms_spam:
    # Map ordinary SMS messages to the negative class.
    ham: 0
    # Map unsolicited or fraudulent SMS messages to the warning class.
    spam: 1
  # Normalize the Metsis Enron-Spam derivative labels.
  enron_spam:
    # Map Enron ham mailboxes to the legitimate class.
    ham: 0
    # Map Enron spam mailboxes to the warning class.
    spam: 1
  # Normalize Apache SpamAssassin public-corpus partitions.
  spamassassin:
    # Map easy legitimate mail to the legitimate class.
    easy_ham: 0
    # Map hard legitimate mail to the legitimate class.
    hard_ham: 0
    # Map spam partitions to the warning class.
    spam: 1
  # Normalize Jose Nazario's phishing-only corpus.
  nazario:
    # Map every Nazario message to the warning class.
    phishing: 1
  # Normalize the local Kaggle phishing-email compilation.
  kaggle_phishing:
    # Map Safe Email rows to the legitimate class.
    Safe Email: 0
    # Map Phishing Email rows to the warning class.
    Phishing Email: 1
  # Normalize the hand-curated, evaluation-only chat-style set (Slice 3).
  # Rows are authored with the binary label already assigned; original_label
  # is documentation only and never re-derived from this mapping.
  chat_style_eval_v1:
    # Map hand-authored ordinary chat messages to the legitimate class.
    legitimate_chat: 0
    # Map hand-authored scam/phishing chat messages to the warning class.
    scam_chat: 1
  # Development-only second chat-style set (never the final reported number).
  chat_style_eval_v2:
    legitimate_chat: 0
    scam_chat: 1

# Reserve the curated chat corpus exclusively for out-of-domain evaluation.
evaluation_policy:
  # Prevent tuning or training on the final chat-style sanity-check set.
  chat_style_eval_training_allowed: false
  # Require independent review of every manually authored evaluation label.
  manual_label_review_required: true
