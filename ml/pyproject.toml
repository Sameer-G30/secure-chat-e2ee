# Configure offline model research as an independent uv project.
[project]
# Give the training workspace a stable package name.
name = "secure-chat-ml"
# Start semantic versioning at the first research slice.
version = "0.1.0"
# Describe the privacy-preserving model-development purpose.
description = "Offline scam-detection data preparation, evaluation, and ONNX export"
# Use the project-wide Python patch version.
requires-python = "==3.11.9"
# Declare exploratory data-analysis and DistilBERT-training dependencies.
dependencies = [
    # Provide notebook execution and interactive research tools.
    "jupyterlab>=4.4,<5",
    # Draw class-balance and text-length visualizations.
    "matplotlib>=3.10,<4",
    # Load and transform labeled tabular text datasets.
    "pandas>=2.3,<3",
    # Train and evaluate the later TF-IDF baseline.
    "scikit-learn>=1.7,<2",
    # Build readable statistical plots on Matplotlib.
    "seaborn>=0.13,<1",
    # Fine-tune DistilBERT on the RTX 4060 (CUDA 12.8 wheels; driver is 13.3).
    "torch>=2.8.0,<2.9",
    # HuggingFace Trainer + DistilBERT-base sequence classification (v4, not v5).
    "transformers>=4.57.3,<4.58",
    # Required by transformers.Trainer for the PyTorch training loop.
    "accelerate>=1.6,<2",
    # Export DistilBERT/LSTM graphs and the TF-IDF logistic head for ONNX Runtime Web.
    "onnx>=1.17,<2",
    # Write model.onnx.br siblings so Vite can serve DistilBERT int8 with Content-Encoding: br.
    "brotli>=1.1,<2",
    # Quantize DistilBERT and verify exported graphs on CPU without touching the 71k reports.
    "onnxruntime>=1.20,<2",
    # Load TF-IDF sweep joblib dumps when exporting the 10k logistic head.
    "joblib>=1.4,<2",
]

# Pull GPU-enabled torch from the CUDA 12.8 index on Linux/Windows only.
[[tool.uv.index]]
# Name the explicit PyTorch CUDA index so generic deps stay on PyPI.
name = "pytorch-cu128"
# Host CUDA 12.8 wheels that run on this WSL2 RTX 4060 (sm_89).
url = "https://download.pytorch.org/whl/cu128"
# Do not use this index for pandas/sklearn/transformers themselves.
explicit = true

# Pin torch to the CUDA index; macOS would fall back to PyPI CPU wheels.
[tool.uv.sources]
# Use +cu128 wheels on the platforms that publish them.
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

# Keep test and lint tools separate from notebook runtime dependencies.
[dependency-groups]
# Define local quality tools for data-preparation scripts.
dev = [
    # Type-check ML utility code.
    "mypy>=1.17,<2",
    # Run data-schema and loader tests added in later slices.
    "pytest>=8.4,<9",
    # Lint and format Python scripts.
    "ruff>=0.12,<1",
]

# Configure Ruff for the selected Python version.
[tool.ruff]
# Match lint behavior to Python 3.11.
target-version = "py311"
# Keep research utilities readable on ordinary displays.
line-length = 100

# Enable common correctness and modernization checks.
[tool.ruff.lint]
# Detect syntax, imports, bug risks, and outdated idioms.
select = ["E", "F", "I", "B", "UP"]

# Allow long string literals in the hand-curated eval-set data file; wrapping
# realistic scam message text across lines would make it harder to read/review.
[tool.ruff.lint.per-file-ignores]
"scripts/build_chat_style_eval_set.py" = ["E501"]
"scripts/build_chat_style_eval_v2.py" = ["E501"]

# Configure pytest to discover the synthetic-data unit tests.
[tool.pytest.ini_options]
# Add the ml src layout to Python's import path while testing.
pythonpath = ["src"]
# Restrict test discovery to the intended test suite.
testpaths = ["tests"]

# Select Hatchling as the package build backend.
[build-system]
# Install Hatchling when building the research utility package.
requires = ["hatchling"]
# Use Hatchling's standards-based build implementation.
build-backend = "hatchling.build"
