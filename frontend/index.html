<!-- Declare standards-mode HTML for predictable browser rendering. -->
<!doctype html>
<!-- Identify the document language for assistive technology. -->
<html lang="en">
  <!-- Provide metadata and the Vite entry contract. -->
  <head>
    <!-- Decode source and user text as Unicode. -->
    <meta charset="UTF-8" />
    <!-- Adapt the layout to the device viewport. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Describe the page for search results and link previews. -->
    <meta name="description" content="End-to-end encrypted chat with private on-device scam detection." />
    <!-- Color supporting mobile browser chrome consistently with the UI. -->
    <meta name="theme-color" content="#963530" />
    <!-- Name the application clearly in browser tabs. -->
    <title>Secure Chat</title>
  </head>
  <!-- Host the React application without inline behavior. -->
  <body>
    <!-- Give React one stable, empty mount point. -->
    <div id="root"></div>
    <!-- Load the TypeScript application through Vite's module pipeline. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
